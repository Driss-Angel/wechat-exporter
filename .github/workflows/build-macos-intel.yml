name: Build macOS Intel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Intel Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Build application
        env:
          PYTHON_BIN: python
        run: bash scripts/build_macos_app.sh

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/微信聊天记录导出.app" \
            "dist/WeChatExporter-macOS-x86_64.zip"

          cd dist
          shasum -a 256 WeChatExporter-macOS-x86_64.zip \
            > WeChatExporter-macOS-x86_64.zip.sha256

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: WeChatExporter-macOS-x86_64
          path: |
            dist/WeChatExporter-macOS-x86_64.zip
            dist/WeChatExporter-macOS-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14
